[package]
name = "launcher95"
version = "0.3.0"
edition = "2021"
description = "A portable Windows 95-style application launcher"
license = "MIT"

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.31", features = ["default_fonts"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.15"
global-hotkey = "0.6"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell"
] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi"
] }
